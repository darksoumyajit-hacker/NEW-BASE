<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AETHER XMD · Admin</title><style>body{margin:0;background:#080810;color:#f6efff;font:15px system-ui;padding:22px}.wrap{max-width:900px;margin:auto}.panel{background:#12121f;border:1px solid #b99aff40;border-radius:16px;padding:18px;margin:14px 0}input,button{padding:12px;border-radius:9px;border:1px solid #b99aff50;background:#090914;color:white;margin:4px;max-width:100%}button{cursor:pointer;background:#6f37c9}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#cfc5e5}.muted{color:#aaa0bf;font-size:12px}</style></head><body><div class="wrap"><h1>✦ AETHER XMD / Admin Console</h1><p class="muted">Admin key is kept in this page's memory only. Use HTTPS and never share it.</p><section class="panel"><label>ADMIN_API_KEY <input id="key" type="password" autocomplete="off" placeholder="Railway admin key"></label><button id="load">Load private report</button><div id="status"></div></section><section class="panel"><h2>Ban number</h2><input id="banphone" placeholder="Country code + number"><input id="reason" placeholder="Reason (optional)"><button id="ban">Ban</button><h2>Unban number</h2><input id="unbanphone" placeholder="Country code + number"><button id="unban">Unban</button></section><section class="panel"><h2>Failed pairing attempts / banned users</h2><pre id="report">Enter admin key to load data.</pre></section></div><script>const $=id=>document.getElementById(id);async function call(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-admin-key':$('key').value},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{const d=await call('/api/admin/summary');$('report').textContent=JSON.stringify(d,null,2);$('status').textContent='Report loaded.'}catch(e){$('status').textContent=e.message}}$('load').onclick=load;$('ban').onclick=async()=>{try{await call('/api/admin/ban',{phone:$('banphone').value,reason:$('reason').value});await load()}catch(e){$('status').textContent=e.message}};$('unban').onclick=async()=>{try{await call('/api/admin/unban',{phone:$('unbanphone').value});await load()}catch(e){$('status').textContent=e.message}};</script></body></html>
